<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MM's PROPERTY - Real Estate Management</title>
    
    <!-- Configurazione Runtime dinamica: Caricata come script statico dal server locale -->
    <script src="env-config.js"></script>
    
    <!-- Google Fonts (Ammessi generalmente, ma caricati via link standard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
     
    <!-- Tailwind CSS (Vite lo ottimizzerà localmente durante la build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      // Sincronizzazione tema sicura
      const isDarkMode = window.appConfig?.darkMode || false;
      if (isDarkMode) { document.documentElement.classList.add('dark'); }

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              brand: {
                50: '#f0f7ff', 100: '#e0f0fe', 200: '#bae2fd', 300: '#7ccbfd',
                400: '#36b2fa', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                800: '#075985', 900: '#0c4a6e', 950: '#082f49',
              }
            }
          }
        }
      }
    </script>
    <style>
      @media print { .no-print { display: none !important; } }
      body.dark { background-color: #0f172a; color: #f8fafc; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .leaflet-container { z-index: 0; border-radius: 1.5rem; }
    </style>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#f8fafc] text-slate-800 font-sans antialiased transition-colors duration-300">
    <div id="root"></div>
    <!-- Vite userà index.tsx come entry point e risolverà le importazioni di @google/genai, React e Recharts dai node_modules locali -->
    <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
