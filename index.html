
<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MM's PROPERTY - Real Estate Management</title>
    
    <!-- Configurazione Runtime dinamica -->
    <script src="env-config.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
     
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { 
              sans: ['DM Sans', 'Inter', 'sans-serif'],
              heading: ['Poppins', 'sans-serif']
            },
            colors: {
              brand: {
                50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                400: '#60a5fa', 500: '#007cff', 600: '#006ce0', 700: '#0056b3',
                800: '#1e40af', 900: '#1e3a8a', 950: '#172554',
              }
            },
            boxShadow: {
              'soft-card': '0 2px 12px -2px rgba(15, 23, 42, 0.04), 0 4px 20px -2px rgba(15, 23, 42, 0.03)',
              'soft-hover': '0 12px 30px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03)',
              'blue-neon': '0 0 15px rgba(0, 124, 255, 0.25)',
              'blue-glow': '0 0 25px rgba(0, 124, 255, 0.12)',
            }
          }
        }
      }
    </script>
    <style>
      @media print { .no-print { display: none !important; } }
      
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
      .leaflet-container { z-index: 0; border-radius: 1.25rem; }

      /* --- GLOBAL DYNAMICS & SCROLLBAR --- */
      body {
        background-color: #f8fafc;
        color: #1e293b;
      }

      /* Glass panel styling in Light Mode */
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px) saturate(120%);
        -webkit-backdrop-filter: blur(16px) saturate(120%);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 1.25rem;
      }
      .glass-card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card-hover:hover {
        transform: translateY(-2px);
        border-color: rgba(0, 124, 255, 0.25);
        box-shadow: 0 12px 30px -4px rgba(15, 23, 42, 0.06);
      }

      /* --- THEME: SAAS ANALYTICS DARK MODE --- */
      .theme-neon {
        background-color: #0b0f19 !important;
        background-image: 
          radial-gradient(circle at 5% 5%, rgba(0, 124, 255, 0.05) 0%, transparent 35%),
          radial-gradient(circle at 95% 85%, rgba(168, 85, 247, 0.04) 0%, transparent 40%),
          linear-gradient(180deg, #0b0f19 0%, #0d1222 100%) !important;
        background-attachment: fixed !important;
        color: #f1f5f9 !important;
      }
      
      .theme-neon ::-webkit-scrollbar-thumb { 
        background: rgba(0, 124, 255, 0.2) !important; 
        border-radius: 10px; 
      }
      .theme-neon ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 124, 255, 0.4) !important;
      }
      
      .theme-neon .bg-white { 
        background-color: rgba(17, 24, 39, 0.75) !important; 
        backdrop-filter: blur(16px) saturate(120%) !important;
        -webkit-backdrop-filter: blur(16px) saturate(120%) !important;
        border-color: rgba(0, 124, 255, 0.15) !important; 
        color: #f1f5f9 !important; 
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03) !important;
      }
      
      .theme-neon .bg-white:hover {
        border-color: rgba(0, 124, 255, 0.35) !important;
        box-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 124, 255, 0.06) !important;
      }
      
      .theme-neon .text-slate-900 { color: #f8fafc !important; }
      .theme-neon .text-slate-800 { color: #f1f5f9 !important; }
      .theme-neon .text-slate-700 { color: #e2e8f0 !important; }
      .theme-neon .text-slate-655, .theme-neon .text-slate-650, .theme-neon .text-slate-600 { color: #cbd5e1 !important; }
      .theme-neon .text-slate-500 { color: #94a3b8 !important; }
      .theme-neon .text-slate-400 { color: #64748b !important; }
      
      .theme-neon .bg-slate-50 { 
        background-color: rgba(10, 15, 30, 0.6) !important; 
        border-color: rgba(0, 124, 255, 0.12) !important;
      }
      .theme-neon .bg-slate-100 { 
        background-color: rgba(17, 24, 39, 0.8) !important; 
        border-color: rgba(0, 124, 255, 0.18) !important;
      }
      
      .theme-neon .border-slate-100, 
      .theme-neon .border-slate-150, 
      .theme-neon .border-slate-200, 
      .theme-neon .border-slate-800, 
      .theme-neon .border-slate-700/50, 
      .theme-neon .border-slate-800/80 { 
        border-color: rgba(0, 124, 255, 0.15) !important; 
      }
      
      /* Vibrant Blue Buttons & Highlights in Dark Mode */
      .theme-neon .bg-brand-600 { 
        background: linear-gradient(135deg, #007cff 0%, #0056b3 100%) !important; 
        color: #ffffff !important;
        box-shadow: 0 4px 15px rgba(0, 124, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
        font-weight: 600 !important;
        border: none !important;
      }
      
      .theme-neon .bg-brand-600:hover { 
        background: linear-gradient(135deg, #3396ff 0%, #0056b3 100%) !important; 
        box-shadow: 0 4px 22px rgba(0, 124, 255, 0.45) !important;
        transform: translateY(-1px) !important;
      }
      
      .theme-neon .text-brand-600, 
      .theme-neon .text-cyan-400 { 
        color: #007cff !important; 
      }
      
      .theme-neon .shadow-soft { 
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.02) !important; 
      }
      
      /* Glowing Inputs in Dark Mode */
      .theme-neon input, 
      .theme-neon select, 
      .theme-neon textarea {
        background-color: rgba(17, 24, 39, 0.85) !important;
        border: 1px solid rgba(0, 124, 255, 0.18) !important;
        color: #f1f5f9 !important;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4) !important;
      }
      .theme-neon input:focus, 
      .theme-neon select:focus, 
      .theme-neon textarea:focus {
        border-color: #007cff !important;
        box-shadow: 0 0 10px rgba(0, 124, 255, 0.25), inset 0 1px 2px rgba(0, 0, 0, 0.4) !important;
      }

      /* Sidebar modifications in Dark Mode */
      .theme-neon .lg\:flex-col.bg-white { 
        background: linear-gradient(180deg, #090c15 0%, #0d1222 100%) !important; 
        border-right: 1px solid rgba(0, 124, 255, 0.12) !important; 
      }
      
      /* Card special borders */
      .theme-neon .rounded-\[2\.5rem\].border-slate-100:hover,
      .theme-neon .rounded-\[2rem\].border-slate-100:hover {
        border-color: rgba(0, 124, 255, 0.35) !important;
        box-shadow: 0 0 25px rgba(0, 124, 255, 0.08) !important;
      }
      
      /* Custom map and charts stylings inside HTML styles */
      .theme-neon .custom-leaflet-marker > div > div {
        background-color: rgba(17, 24, 39, 0.95) !important;
        border-color: rgba(0, 124, 255, 0.35) !important;
        color: #fff !important;
      }
      .theme-neon .custom-leaflet-marker > div > div:hover {
        border-color: #007cff !important;
        box-shadow: 0 0 15px rgba(0, 124, 255, 0.2) !important;
      }

      /* Transitions */
      * { transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease; }
    </style>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "vite": "https://esm.sh/vite@^7.3.1",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#f8fafc] text-slate-800 font-sans antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
