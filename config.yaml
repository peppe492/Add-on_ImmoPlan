
name: "MM's PROPERTY Manager"
version: "1.4.0"
slug: "mm_property_manager"
description: "Gestione avanzata costi immobiliari, ristrutturazioni e affitti con AI Gemini, Archivio Detrazioni Fiscali 730, Calendario Scadenze e supporto mappe."
url: "https://github.com/peppe492/Add-on_ImmoPlan"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
ingress: true
ingress_port: 9301
hassio_api: true
homeassistant_api: true
panel_icon: mdi:home-analytics
panel_title: "Gestione Immobili"
map:
  - share:rw
  - config:rw
  - ssl:ro
  - data:rw
options:
  api_key: ""
  ha_token: ""
  app_title: "MM's PROPERTY"
  dark_mode: false
  log_level: "info"
  sensor_prefix: "immoplan"
  sync_interval: 60
schema:
  api_key: str
  ha_token: str
  app_title: str
  dark_mode: bool
  log_level: str
  sensor_prefix: str
  sync_interval: int
